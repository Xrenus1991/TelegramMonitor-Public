name: Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONPATH: "."
    steps:
      - name: Checkout public snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile Python source without executing project code
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path(".").rglob("*.py"))
          assert files, "No Python files found"
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Parsed {len(files)} Python files")
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check '.[dev]' fastapi httpx 'SQLAlchemy>=2,<3' openpyxl
      - name: Run unit tests without production credentials
        run: |
          # The sanitized public snapshot does not ship deploy/sherlock/bridge.py.
          # Keep these component tests explicitly excluded until the bridge is
          # independently reviewed and included. Do not report them as passed.
          if test -e deploy/sherlock/bridge.py; then
            python -m pytest -q -p pytest_asyncio.plugin tests
          else
            echo "::warning::Sherlock bridge absent: 19 component tests are not executed."
            python -m pytest -q -p pytest_asyncio.plugin tests \
              --ignore=tests/test_sherlock_advanced_offline.py \
              --ignore=tests/test_sherlock_bridge_offline.py \
              -k 'not test_sherlock_bridge_isolated_local_database'
          fi
