[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-monitor"
version = "1.0.0"
description = "Real-time Telegram channel monitoring with AI-powered intelligence briefings"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Zohar Babin" },
]
keywords = ["telegram", "monitoring", "intelligence", "claude", "osint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Security",
]
dependencies = [
    "telethon>=1.42.0",
    "cryptg>=0.5",
    "python-dotenv>=1.0.0",
    "textual>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
translation = ["lingua-language-detector==2.2.0"]
unicode = ["confusable_homoglyphs==3.3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]
openai = ["openai>=1.80.0"]
wizard = ["claude-agent-sdk>=0.1.33"]
cloud = ["SQLAlchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4", "fastapi>=0.115", "uvicorn>=0.32", "openai>=1.80", "telethon>=1.42", "python-dotenv>=1.0"]

[project.urls]
Repository = "https://github.com/zoharbabin/telegram-monitor"
Issues = "https://github.com/zoharbabin/telegram-monitor/issues"

[project.scripts]
telegram-monitor = "telegram_monitor.cli:main"
telegram-monitor-join = "telegram_monitor.join:main"
telegram-monitor-configure = "telegram_monitor.wizard:main"

[tool.setuptools.packages.find]
include = ["telegram_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

# Cloud v7 dependencies are OPTIONAL; legacy Mac/TUI mode remains intact.
